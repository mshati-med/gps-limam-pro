<style>

x;display:flex;flex-direction:column;gap:8px}.round{width:46px;height:46px;border-radius:15px;background:#0c1929ee;color:white;border:1px solid #34475d;font-size:20px;box-shadow:0 6px 20px #0004}.bottom{z-index:450;position:absolute;bottom:0;left:0;right:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#08111f00 0%,#08111f 14%);pointer-events:none}.sheet{pointer-events:auto;background:rgba(10,20,35,.97);border:1px solid var(--line);border-radius:23px;padding:13px;box-shadow:0 15px 45px #0007;max-height:52dvh;overflow:auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.sheet-head strong{font-size:14px}.sheet-head small{font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#132238;border:1px solid #21354d;border-radius:13px;text-align:center;padding:9px 3px}.stat b{display:block;color:var(--green);font-size:17px;font-variant-numeric:tabular-nums}.stat span{font-size:10px;color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}.actions button{font-size:12px;padding:11px 5px;white-space:normal;min-height:42px}.status{font-size:11px;color:var(--gold);text-align:center;min-height:20px;padding:6px 2px 0}.tabs{display:flex;gap:6px;margin:10px 0 0;overflow-x:auto}.tab{background:#15243a;color:#b5c5d8;border:1px solid #283b52;border-radius:999px;padding:8px 13px;font-size:12px;white-space:nowrap}.tab.active{background:#1d4939;color:#9affc9;border-color:#2e8c65}.list{margin-top:9px;display:grid;gap:7px}.item{display:flex;align-items:center;gap:8px;padding:9px;background:#132238;border:1px solid #26384e;border-radius:12px}.item .info{flex:1;min-width:0}.item b{font-size:12px;display:block;overflow-wrap:anywhere}.item small{color:var(--muted);font-size:10px}.item button{background:#23344a;color:#f4f8ff;border-radius:9px;padding:8px;font-size:11px}.empty{color:var(--muted);font-size:12px;text-align:center;padding:14px}.modal{position:absolute;z-index:900;inset:0;background:#020711b8;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.open{display:flex}.dialog{width:min(600px,100%);max-height:80dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px}.dialog h2{font-size:17px;margin:0 0 12px}.dialog p{font-size:13px;line-height:1.7;color:#c0cddd}.dialog .row{display:flex;gap:8px;margin-top:10px}.dialog .row>*{flex:1;min-width:0}.field{width:100%;background:#091525;color:white;border:1px solid #31445b;border-radius:12px;padding:12px;outline:none}.hidden{display:none!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#102036;color:#f4f8ff}.leaflet-popup-content{font-family:system-ui;line-height:1.7}.leaflet-container a{color:#7dd3fc}@media(min-width:760px){.searchbar{top:88px;left:auto;right:20px;width:370px}.float-tools{top:150px;left:20px}.bottom{left:20px;right:auto;width:440px;bottom:14px}.sheet{max-height:70vh}.top{padding-left:22px;padding-right:22px}.round{width:48px;height:48px}}

<body><div class="app"><header class="top"><div class="brand"><div class="logo">⌖</div><div><h1>GPS LIMAM <span style="color:var(--green)">PRO</span></h1><p>مساعدك الذكي للموقع والرحلات</p></div></div><span class="pill" id="connection">● جاهز</span></header><div id="map" aria-label="الخريطة"></div>
<div class="searchbar"><input id="searchInput" autocomplete="off" placeholder="ابحث عن مكان أو مدينة أو إحداثيات…"><button class="btn primary" id="searchBtn">بحث</button></div>
<div class="float-tools"><button class="round" id="locateBtn" title="موقعي الحالي">◎</button><button class="round" id="layersBtn" title="تبديل الخريطة">▧</button><button class="round" id="shareBtn" title="مشاركة موقعي">↗</button><button class="round" id="favBtn" title="المفضلة">★</button></div>
<div class="bottom"><section class="sheet"><div class="sheet-head"><div><strong id="panelTitle">لوحة الرحلة</strong><br><small id="gpsText">بانتظار إذن الموقع</small></div><button class="btn secondary" id="moreBtn">القائمة ☰</button></div><div class="stats"><div class="stat"><b id="speed">—</b><span>كم/س</span></div><div class="stat"><b id="altitude">—</b><span>الارتفاع م</span></div><div class="stat"><b id="distance">0.00</b><span>المسافة كم</span></div><div class="stat"><b id="points">0</b><span>نقاط المسار</span></div></div><div class="actions"><button class="btn primary" id="trackBtn">▶ بدء التسجيل</button><button class="btn secondary" id="saveBtn">📍 حفظ المكان</button><button class="btn blue" id="routeBtn">🧭 مسار إلى هنا</button></div><div class="actions"><button class="btn secondary" id="carBtn">🚙 حفظ السيارة</button><button class="btn secondary" id="backBtn">↩ العودة للسيارة</button><button class="btn secondary" id="exportBtn">⇩ تصدير GPX</button></div><div class="status" id="status" role="status">فعّل الموقع للبدء. يعمل حفظ الأماكن والمسارات على هذا الجهاز.</div><div class="tabs"><button class="tab active" data-tab="places">المفضلة</button><button class="tab" data-tab="track">المسار الحالي</button><button class="tab" data-tab="tools">أدوات إضافية</button></div><div id="content" class="list"><div class="empty">لا توجد أماكن محفوظة بعد.</div></div></section></div></div>
<div class="modal" id="modal"><div class="dialog"><div class="sheet-head"><h2 id="modalTitle">القائمة</h2><button class="btn secondary" id="closeModal">إغلاق ✕</button></div><div id="modalContent"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),status=m=>$('status').textContent=m;const KEY='gps_limam_pro_v2';
let map,baseLayers={},currentLayer='standard',me=null,meMarker=null,accuracyCircle=null,car=null,places=[],track=[],tracking=false,watchId=null,routeLine=null,routeStart=null,routeEnd=null,routeMarkers=[],tab='places',lastFix=null,targetPos=null,targetMarker=null;
const safeParse=(s,f)=>{try{return JSON.parse(s)||f}catch{return f}};let saved=safeParse(localStorage.getItem(KEY),{places:[],track:[],car:null});places=Array.isArray(saved.places)?saved.places:[];track=Array.isArray(saved.track)?saved.track:[];car=saved.car||null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify({places,track,car}));}catch(e){status('مساحة التخزين ممتلئة؛ صدّر المسار للحفاظ عليه.')}}
function hav(a,b){const R=6371000,rad=x=>x*Math.PI/180,d1=(b[0]-a[0])*Math.PI/180,d2=(b[1]-a[1])*Math.PI/180,x=Math.sin(d1/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(d2/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function trackDistance(){let n=0;for(let i=1;i<track.length;i++)n+=hav(track[i].ll,track[i-1].ll);return n/1000}
function init(){map=L.map('map',{zoomControl:false}).setView([20.5,-12.5],6);baseLayers.standard=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});baseLayers.standard.addTo(map);map.on('click',e=>{targetPos=[e.latlng.lat,e.latlng.lng];if(targetMarker)targetMarker.setLatLng(e.latlng);else targetMarker=L.marker(e.latlng).addTo(map);targetMarker.bindPopup('الوجهة المحددة<br><button onclick="window.gpsLimamRouteTarget()">احسب المسار إلى هنا</button>').openPopup();status('تم تحديد الوجهة على الخريطة.');});baseLayers.satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});routeLine=L.polyline([],{color:'#38bdf8',weight:5,opacity:.9}).addTo(map);restoreMap();render();const q=new URLSearchParams(location.search);const lat=Number(q.get('lat')),lon=Number(q.get('lon'));if(q.has('lat')&&q.has('lon')&&Number.isFinite(lat)&&Number.isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180){map.setView([lat,lon],16);targetPos=[lat,lon];targetMarker=L.marker([lat,lon]).addTo(map).bindPopup('📍 موقع تمت مشاركته معك').openPopup();$('searchInput').value=`${lat}, ${lon}`;status('تم فتح الموقع المشارك.');}if('geolocation'in navigator){navigator.geolocation.getCurrentPosition(onPosition,e=>status(errorText(e)),{enableHighAccuracy:true,timeout:12000,maximumAge:15000});}else status('المتصفح لا يدعم تحديد الموقع.');$('connection').textContent=navigator.onLine?'● متصل':'● دون اتصال';window.addEventListener('online',()=>$('connection').textContent='● متصل');window.addEventListener('offline',()=>$('connection').textContent='● دون اتصال');}
function restoreMap(){track.forEach(p=>{if(p.ll&&p.ll.length===2)L.circleMarker(p.ll,{radius:3,color:'#38e08f'}).addTo(map)});if(track.length>1)routeLine.setLatLngs(track.map(p=>p.ll));if(car)L.marker(car,{title:'السيارة'}).addTo(map).bindPopup('🚙 موقع السيارة المحفوظ');places.forEach(addPlaceMarker)}
function errorText(e){return e.code===1?'إذن الموقع مرفوض. فعّله من إعدادات المتصفح.':e.code===2?'تعذر تحديد الموقع؛ تحقق من GPS.':e.code===3?'انتهت مهلة تحديد الموقع. حاول مجددًا.':'تعذر تحديد الموقع.'}
function onPosition(pos){const c=pos.coords,ll=[c.latitude,c.longitude];lastFix=ll;$('gpsText').textContent=`دقة GPS ±${Math.round(c.accuracy||0)} م`;$('speed').textContent=c.speed==null?'—':Math.round(c.speed*3.6);$('altitude').textContent=c.altitude==null?'—':Math.round(c.altitude);if(!meMarker){meMarker=L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#38e08f',fillOpacity:1}).addTo(map).bindPopup('موقعي الحالي');map.setView(ll,15)}else meMarker.setLatLng(ll);if(accuracyCircle)accuracyCircle.setLatLng(ll).setRadius(c.accuracy||0);else accuracyCircle=L.circle(ll,{radius:c.accuracy||0,color:'#38e08f',weight:1,fillOpacity:.06}).addTo(map);if(tracking){const last=track.length?track[track.length-1]:null;if(!last||hav(last.ll,ll)>=8){track.push({ll,t:Date.now(),acc:c.accuracy||null});persist();routeLine.setLatLngs(track.map(p=>p.ll));$('points').textContent=track.length;$('distance').textContent=trackDistance().toFixed(2);renderTrack()}}if(!tracking)status('تم تحديث موقعك.');}
function locate(){if(!navigator.geolocation)return status('المتصفح لا يدعم GPS');status('جارٍ تحديد موقعك…');navigator.geolocation.getCurrentPosition(p=>{onPosition(p);map.setView([p.coords.latitude,p.coords.longitude],16);status('تم تحديد موقعك.');},e=>status(errorText(e)),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function addPlaceMarker(p){if(!p.ll)return;L.marker(p.ll).addTo(map).bindPopup(`<b>${escapeHtml(p.name)}</b><br>${p.ll[0].toFixed(5)}, ${p.ll[1].toFixed(5)}`)}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function savePlace(){const ll=lastFix||(meMarker&&[meMarker.getLatLng().lat,meMarker.getLatLng().lng]);if(!ll)return status('حدد موقعك أولًا.');const name=prompt('أدخل اسم المكان:','مكان محفوظ '+(places.length+1));if(name===null)return;places.unshift({id:Date.now(),name:name.trim()||'مكان محفوظ',ll:[...ll],created:Date.now()});persist();addPlaceMarker(places[0]);render();status('تم حفظ المكان على هذا الجهاز.');}
function saveCar(){const ll=lastFix;if(!ll)return status('حدد موقعك أولًا.');car=[...ll];persist();L.marker(car).addTo(map).bindPopup('🚙 السيارة هنا');status('تم حفظ موقع السيارة.');}
function toggleTrack(){tracking=!tracking;$('trackBtn').textContent=tracking?'⏸ إيقاف التسجيل':'▶ بدء التسجيل';if(tracking){if(!navigator.geolocation){tracking=false;return status('GPS غير متاح.')}if(watchId===null)watchId=navigator.geolocation.watchPosition(onPosition,e=>status(errorText(e)),{enableHighAccuracy:true,maximumAge:1000,timeout:15000});status('التسجيل يعمل؛ ستُحفظ النقاط محليًا.');}else{status('تم إيقاف التسجيل وحفظ المسار.');persist();}render()}
async function search(){const q=$('searchInput').value.trim();if(!q)return status('اكتب اسم مكان أو إحداثيات.');const pair=q.split(/[ ,;]+/).map(Number);if(pair.length===2&&pair.every(Number.isFinite)&&Math.abs(pair[0])<=90&&Math.abs(pair[1])<=180){targetPos=pair;map.setView(pair,16);if(targetMarker)targetMarker.setLatLng(pair);else targetMarker=L.marker(pair).addTo(map);targetMarker.bindPopup('📍 '+escapeHtml(q)).openPopup();status('تم تحديد الوجهة بالإحداثيات.');return}if(!navigator.onLine)return status('البحث عن الأماكن يحتاج اتصالًا بالإنترنت.');status('جارٍ البحث عن المكان…');try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q='+encodeURIComponent(q),{headers:{'Accept-Language':'ar'}});if(!r.ok)throw Error();const data=await r.json();if(!data.length)return status('لم نعثر على نتيجة. جرّب اسمًا آخر.');const first=data[0],ll=[Number(first.lat),Number(first.lon)];targetPos=ll;map.setView(ll,15);if(targetMarker)targetMarker.setLatLng(ll);else targetMarker=L.marker(ll).addTo(map);targetMarker.bindPopup(escapeHtml(first.display_name)).openPopup();status(`تم العثور على ${data.length} نتيجة. ${first.display_name}`);showResults(data)}catch(e){status('تعذر البحث الآن؛ تحقق من الإنترنت وحاول مجددًا.')}}
function showResults(data){openModal('نتائج البحث',data.map(d=>`<div class="item"><div class="info"><b>${escapeHtml(d.name||d.display_name.split(',')[0])}</b><small>${escapeHtml(d.display_name)}</small></div><button data-go="${d.lat},${d.lon}">عرض</button></div>`).join(''));$('modalContent').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const ll=b.dataset.go.split(',').map(Number);map.setView(ll,16);L.marker(ll).addTo(map).bindPopup('نتيجة البحث').openPopup();$('modal').classList.remove('open')})}
async function buildRoute(dest){const origin=lastFix;if(!origin)return status('حدد موقعك أولًا.');if(!navigator.onLine)return status('حساب مسار الطرق يحتاج اتصالًا بالإنترنت.');status('جارٍ حساب المسار…');try{const url=`https://router.project-osrm.org/route/v1/driving/${origin[1]},${origin[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson`;const r=await fetch(url);if(!r.ok)throw Error();const j=await r.json();if(j.code!=='Ok'||!j.routes.length)throw Error();const route=j.routes[0],coords=route.geometry.coordinates.map(c=>[c[1],c[0]]);routeLine.setLatLngs(coords);routeStart=origin;routeEnd=dest;map.fitBounds(routeLine.getBounds(),{padding:[30,30]});status(`المسافة على الطريق ${(route.distance/1000).toFixed(1)} كم · الوقت التقريبي ${Math.round(route.duration/60)} دقيقة`)}catch(e){status('لم نتمكن من حساب الطريق الآن. جرّب لاحقًا.')}}
function shareLocation(){const ll=lastFix;if(!ll)return status('حدد موقعك أولًا.');const url=`${location.origin}${location.pathname}?lat=${ll[0].toFixed(6)}&lon=${ll[1].toFixed(6)}`;const text=`موقعي عبر GPS LIMAM PRO: ${ll[0].toFixed(6)}, ${ll[1].toFixed(6)}\n${url}`;if(navigator.share)navigator.share({title:'موقعي - GPS LIMAM PRO',text,url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>status('تم نسخ رابط الموقع. أرسله لصديقك.')).catch(()=>prompt('انسخ رابط الموقع:',url));else prompt('انسخ رابط الموقع:',url);}
function exportGPX(){if(!track.length)return status('لا يوجد مسار لتصديره.');const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');let xml='<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="GPS LIMAM PRO" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>GPS LIMAM PRO Track</name><trkseg>';track.forEach(p=>{xml+=`<trkpt lat="${p.ll[0]}" lon="${p.ll[1]}"><time>${new Date(p.t).toISOString()}</time></trkpt>`});xml+='</trkseg></trk>';places.forEach(p=>xml+=`<wpt lat="${p.ll[0]}" lon="${p.ll[1]}"><name>${esc(p.name)}</name></wpt>`);xml+='</gpx>';const a=document.createElement('a'),u=URL.createObjectURL(new Blob([xml],{type:'application/gpx+xml'}));a.href=u;a.download=`gps-limam-${new Date().toISOString().slice(0,10)}.gpx`;a.click();URL.revokeObjectURL(u);status('تم تصدير ملف GPX.');}
function render(){ $('points').textContent=track.length;$('distance').textContent=trackDistance().toFixed(2);if(tab==='places'){ $('content').innerHTML=places.length?places.map((p,i)=>`<div class="item"><div class="info"><b>★ ${escapeHtml(p.name)}</b><small>${p.ll[0].toFixed(5)}, ${p.ll[1].toFixed(5)}</small></div><button data-show="${p.id}">عرض</button><button data-route="${p.id}">مسار</button><button data-del="${p.id}">حذف</button></div>`).join(''):'<div class="empty">لا توجد أماكن محفوظة. اضغط «حفظ المكان» لإضافة أول مكان.</div>'; }else if(tab==='track')renderTrack();else renderTools();$('content').querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{const p=places.find(x=>x.id==b.dataset.show);if(p){map.setView(p.ll,17);L.popup().setLatLng(p.ll).setContent(escapeHtml(p.name)).openOn(map)}});$('content').querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{const p=places.find(x=>x.id==b.dataset.route);if(p)buildRoute(p.ll)});$('content').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{places=places.filter(x=>x.id!=b.dataset.del);persist();render();status('تم حذف المكان من المفضلة.')});}
function renderTrack(){ $('content').innerHTML=track.length?`<div class="item"><div class="info"><b>المسار الحالي</b><small>${track.length} نقطة · ${trackDistance().toFixed(2)} كم تقريبًا</small></div><button id="fitTrack">عرض</button><button id="clearTrack">مسح</button></div><p style="font-size:11px;color:var(--muted)">المسار محفوظ محليًا على هذا الجهاز. صدّره بصيغة GPX للاحتفاظ بنسخة أو فتحه في تطبيق خرائط آخر.</p>`:'<div class="empty">ابدأ التسجيل لإضافة نقاط المسار.</div>';const f=$('fitTrack');if(f)f.onclick=()=>{if(track.length)map.fitBounds(L.latLngBounds(track.map(p=>p.ll)),{padding:[30,30]})};const c=$('clearTrack');if(c)c.onclick=()=>{if(confirm('هل تريد مسح المسار الحالي نهائيًا؟')){track=[];routeLine.setLatLngs([]);persist();render();status('تم مسح المسار.')}}}
function renderTools(){$('content').innerHTML=`<div class="actions" style="margin-top:0"><button class="btn secondary" id="shareBtn2">↗ مشاركة موقعي</button><button class="btn secondary" id="gpxBtn2">⇩ تصدير GPX</button><button class="btn secondary" id="backupBtn">نسخ احتياطي</button><button class="btn secondary" id="restoreBtn">استعادة نسخة</button><button class="btn secondary" id="offlineInfo">دون إنترنت</button><button class="btn warn" id="resetBtn">مسح بيانات التطبيق</button></div><p style="font-size:11px;color:var(--muted);line-height:1.7">تعمل بيانات الأماكن والمسار المحفوظة دون اتصال. البحث عن الأماكن، حساب طرق القيادة، وخرائط جديدة تحتاج الإنترنت. قد تظهر بلاطات سبق تحميلها في المتصفح فقط؛ لا نزعم تنزيل خريطة كاملة دون إعداد مزود خرائط يدعم ذلك.</p>`;$('shareBtn2').onclick=shareLocation;$('gpxBtn2').onclick=exportGPX;$('backupBtn').onclick=backup;$('restoreBtn').onclick=()=> $('backupFile').click();$('offlineInfo').onclick=()=>alert('دون اتصال: يمكنك الوصول إلى الأماكن والمسارات المحفوظة على هذا الجهاز. الخرائط والبحث وحساب الطرق قد تحتاج اتصالًا.');$('resetBtn').onclick=()=>{if(confirm('مسح جميع الأماكن والمسارات والسيارة المحفوظة؟ لا يمكن التراجع.')){places=[];track=[];car=null;persist();location.reload()}};}
function backup(){const data=JSON.stringify({version:2,places,track,car},null,2),a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.href=u;a.download='gps-limam-backup.json';a.click();URL.revokeObjectURL(u);status('تم تنزيل النسخة الاحتياطية.')}
function openModal(title,html){$('modalTitle').textContent=title;$('modalContent').innerHTML=html;$('modal').classList.add('open')}
$('locateBtn').onclick=locate;$('searchBtn').onclick=search;$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('saveBtn').onclick=savePlace;$('carBtn').onclick=saveCar;$('trackBtn').onclick=toggleTrack;$('shareBtn').onclick=shareLocation;$('exportBtn').onclick=exportGPX;$('routeBtn').onclick=()=>{if(targetPos)buildRoute(targetPos);else status('ابحث عن وجهة أو اضغط على الخريطة لتحديدها أولًا.')};$('backBtn').onclick=()=>{if(!car)return status('احفظ موقع السيارة أولًا.');if(!lastFix)return status('حدد موقعك أولًا.');buildRoute(car)};$('layersBtn').onclick=()=>{map.removeLayer(baseLayers[currentLayer]);currentLayer=currentLayer==='standard'?'satellite':'standard';baseLayers[currentLayer].addTo(map);status(currentLayer==='satellite'?'تم تفعيل صور الأقمار الصناعية.':'تم تفعيل خريطة الشوارع.')};$('favBtn').onclick=()=>{tab='places';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));render();$('panelTitle').textContent='الأماكن المفضلة'};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('panelTitle').textContent=tab==='places'?'الأماكن المفضلة':tab==='track'?'المسار الحالي':'أدوات إضافية';render()});$('moreBtn').onclick=()=>{tab='tools';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='tools'));$('panelTitle').textContent='أدوات إضافية';render()};$('closeModal').onclick=()=>$('modal').classList.remove('open');$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open')});
const file=document.createElement('input');file.type='file';file.accept='application/json,.json';file.id='backupFile';file.className='hidden';document.body.appendChild(file);file.onchange=async()=>{const f=file.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.places)||!Array.isArray(d.track))throw Error();if(!confirm('استبدال البيانات الحالية بالنسخة الاحتياطية؟'))return;places=d.places;track=d.track;car=d.car||null;persist();location.reload()}catch(e){status('ملف النسخة الاحتياطية غير صالح.')}file.value=''};
window.gpsLimamRouteTarget=()=>{if(targetPos)buildRoute(targetPos)};
init();
})();
</script></body></html>
