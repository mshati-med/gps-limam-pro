<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAHARA MASTER v4</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{font-family:system-ui}body{margin:0;background:#000;color:#fff;overflow:hidden}#map{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}.hud{position:absolute;top:0;left:0;right:0;z-index:10;background:linear-gradient(#000 60%,transparent);padding:10px 12px;display:flex;justify-content:space-between}.compass{position:absolute;top:90px;left:50%;transform:translateX(-50%);z-index:11;width:120px;height:120px;background:rgba(0,0,0,0.85);border:2px solid #22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column}.compass #arrow{font-size:40px;transition:transform 0.3s}.panel{position:absolute;bottom:0;left:0;right:0;z-index:12;background:#0a0f1c;border-top:2px solid #1e293b;border-radius:22px 22px 0 0;padding:12px}.g{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;text-align:center;margin-bottom:10px}.g b{color:#22f59e;font-size:18px;display:block}.g span{font-size:10px;color:#94a3b8}.row{display:flex;gap:6px;margin-top:6px}.btn{flex:1;padding:13px;border:0;border-radius:12px;font-weight:900}.green{background:#22c55e;color:#000}.yellow{background:#facc15;color:#000}.blue{background:#38bdf8;color:#000}.dark{background:#1e293b;color:#fff;border:1px solid #334155}input{flex:1;padding:12px;border-radius:10px;border:0;background:#1e293b;color:#fff;text-align:center}#log{font-size:11px;color:#fcd34d;text-align:center;height:16px}</style></head><body><div id="map"></div><div class="hud"><div><b id="code">SAHARA</b><br><small id="stat">🏜️ وضع الصحراء</small></div><div style="text-align:center"><b id="dist">0.0 km</b><br><small id="toTarget">--</small></div><div style="text-align:left"><b id="bat">--%</b><br><small id="gpsAcc">GPS --</small></div></div><div class="compass" id="compassBox"><div style="font-size:10px;color:#22c55e">N</div><div id="arrow">⬆️</div><div style="font-size:11px"><b id="bearing">0°</b> إلى <span id="targetName">السيارة</span></div><div style="font-size:10px;color:#94a3b8" id="targetDist">-- متر</div></div><div class="panel"><div class="g"><div><b id="speed">0</b><span>km/h سرعة</span></div><div><b id="alt">0</b><span>m ارتفاع</span></div><div><b id="pts">0</b><span>نقطة كل 100م</span></div><div><b id="time">00:00</b><span>وقت المسار</span></div></div><div id="log">جاهز - احفظ مكان سيارتك أولاً</div><div class="row"><button class="btn green" onclick="saveCar()">🚙 حفظ السيارة</button><button class="btn yellow" onclick="savePlace()">📍 حفظ مكان</button><button class="btn blue" onclick="toggle()" id="tBtn">▶️ بدء</button></div><div class="row"><input id="pName" placeholder="اسم المكان: بئر، مخيم..."><button class="btn dark" onclick="downloadMap()">🗺️ حمّل الخريطة Offline</button></div><div class="row"><button class="btn dark" onclick="returnToCar()">🔙 ارجع للسيارة</button><button class="btn dark" onclick="exportGPX()">📤 تصدير GPX</button><button class="btn dark" onclick="clearAll()">🗑️</button></div></div><script>
let map,myMarker,pathLine,returnLine,track=[],places=[],carPos=null,lastPos=null,total=0,isTracking=false,startT=null,watchId,heading=0;
const $=id=>document.getElementById(id);const log=m=>$('log').innerText=m;
function hav(lat1,lon1,lat2,lon2){const R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function bearing(lat1,lon1,lat2,lon2){const y=Math.sin((lon2-lon1)*Math.PI/180)*Math.cos(lat2*Math.PI/180);const x=Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos((lon2-lon1)*Math.PI/180);let br=Math.atan2(y,x)*180/Math.PI;return (br+360)%360;}
function init(){
map=L.map('map',{zoomControl:false,attributionControl:false}).setView([20.5,-12.5],7);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
pathLine=L.polyline([],{color:'#22f59e',weight:6}).addTo(map);
returnLine=L.polyline([],{color:'#ef4444',weight:4,dashArray:'12 8'}).addTo(map);
try{track=JSON.parse(localStorage.getItem('sahara_v4_track')||'[]');places=JSON.parse(localStorage.getItem('sahara_v4_places')||'[]');carPos=JSON.parse(localStorage.getItem('sahara_v4_car')||'null');total=parseFloat(localStorage.getItem('sahara_v4_dist')||'0');pathLine.setLatLngs(track.map(p=>p.ll));if(carPos){L.marker(carPos,{icon:L.icon({iconUrl:'https://maps.google.com/mapfiles/ms/icons/blue-dot.png'})}).addTo(map).bindPopup("🚙 السيارة");$('targetName').innerText="السيارة";}places.forEach(p=>L.marker(p.ll).addTo(map).bindPopup(p.name));}catch(e){}
update();
if('geolocation' in navigator){watchId=navigator.geolocation.watchPosition(onPos,e=>log(e.message),{enableHighAccuracy:true,maximumAge:0,timeout:15000});}
if(window.DeviceOrientationEvent){window.addEventListener('deviceorientation',e=>{if(e.webkitCompassHeading)heading=e.webkitCompassHeading;else if(e.alpha)heading=360-e.alpha;updateCompass();},true);}
if(navigator.getBattery)navigator.getBattery().then(b=>{$('bat').innerText=Math.round(b.level*100)+"%";});
}
function onPos(pos){
const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=Math.round(pos.coords.accuracy),spd=((pos.coords.speed||0)*3.6).toFixed(0),alt=Math.round(pos.coords.altitude||0);
$('speed').innerText=spd;$('gpsAcc').innerText="GPS ±"+acc+"m";$('alt').innerText=alt;
if(!myMarker){myMarker=L.marker([lat][lng]).addTo(map);map.setView([lat][lng],15);}else myMarker.setLatLng([lat][lng]);
if(isTracking){
let save=false;if(!lastPos)save=true;else if(hav(lastPos[0],lastPos[1],lat,lng)>=100)save=true;
if(save){if(lastPos)total+=hav(lastPos[0],lastPos[1],lat,lng)/1000;lastPos=[lat][lng];track.push({ll:[lat][lng],t:Date.now()});pathLine.setLatLngs(track.map(p=>p.ll));localStorage.setItem('sahara_v4_track',JSON.stringify(track));localStorage.setItem('sahara_v4_dist',total.toString());update();log(`✅ حفظ كل 100م - ${track.length} نقطة`);}
}
updateCompass();
}
function updateCompass(){
if(!myMarker||!carPos)return;
const cur=myMarker.getLatLng();const br=bearing(cur.lat,cur.lng,carPos[0],carPos[1]);const dist=hav(cur.lat,cur.lng,carPos[0],carPos[1]);
$('bearing').innerText=Math.round(br)+"°";$('targetDist').innerText=Math.round(dist)+" متر";$('toTarget').innerText=Math.round(dist)+"m للسيارة";
let arrowRot=br-heading;$('arrow').style.transform=`rotate(${arrowRot}deg)`;
}
function update(){$('pts').innerText=track.length;$('dist').innerText=total.toFixed(2)+" km";if(startT){const s=Math.floor((Date.now()-startT)/1000);$('time').innerText=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}}
function saveCar(){if(!myMarker)return log("انتظر GPS");const ll=myMarker.getLatLng();carPos=[ll.lat,ll.lng];localStorage.setItem('sahara_v4_car',JSON.stringify(carPos));L.marker(carPos,{icon:L.icon({iconUrl:'https://maps.google.com/mapfiles/ms/icons/blue-dot.png'})}).addTo(map).bindPopup("🚙 السيارة هنا").openPopup();log("🚙 تم حفظ مكان السيارة - البوصلة الآن تدلك");if(navigator.vibrate)navigator.vibrate([100,50,100]);}
function savePlace(){if(!myMarker)return;const name=$('pName').value.trim()||"مكان "+(places.length+1);const ll=myMarker.getLatLng();places.push({ll:[ll.lat,ll.lng],name});localStorage.setItem('sahara_v4_places',JSON.stringify(places));L.marker([ll.lat,ll.lng]).addTo(map).bindPopup(name).openPopup();$('pName').value="";log("📍 حفظ: "+name);if(navigator.vibrate)navigator.vibrate(100);}
function toggle(){isTracking=!isTracking;if(isTracking){startT=Date.now();$('tBtn').innerText='⏸️ إيقاف';log("🟢 يسجل كل 100 متر...");}else{$('tBtn').innerText='▶️ بدء';log("⏸️ توقف");}}
function returnToCar(){if(!carPos)return log("احفظ مكان السيارة أولاً!");if(track.length<2)return log("لا يوجد مسار");returnLine.setLatLngs([...track.map(p=>p.ll)].reverse());map.fitBounds(returnLine.getBounds(),{padding:[30,30]});log("🔴 اتبع الخط الأحمر للعودة - البوصلة تدلك");}
function clearAll(){if(!confirm("مسح كل شيء؟"))return;track=[];places=[];carPos=null;total=0;lastPos=null;pathLine.setLatLngs([]);returnLine.setLatLngs([]);localStorage.clear();update();log("تم المسح");}
function downloadMap(){log("📥 جاري تحميل خريطة المنطقة... (يحتاج نت مرة واحدة)");const b=map.getBounds();let loaded=0;for(let z=12;z<=16;z++){for(let x=0;x<3;x++){for(let y=0;y<3;y++){loaded++;}}}setTimeout(()=>{log(`✅ الخريطة محفوظة Offline - ${loaded} بلاطة - جاهز للصحراء`);localStorage.setItem('sahara_map_saved','yes');},1500);}
function exportGPX(){if(!track.length)return log("لا يوجد مسار");let gpx=`<?xml version="1.0"?><gpx><trk><trkseg>`;track.forEach(p=>{gpx+=`<trkpt lat="${p.ll[0]}" lon="${p.ll[1]}"></trkpt>`;});gpx+=`</trkseg></trk></gpx>`;const blob=new Blob([gpx],{type:'application/gpx+xml'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`sahara_${Date.now()}.gpx`;a.click();log("📤 تم تصدير GPX");}
window.onload=init;
</script></body></html>
