<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS LIMAM PRO v2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0a0e1a;--card:#151b2d;--accent:#00ff88;--accent2:#00d4ff}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:var(--bg);color:#e6eaf2;height:100vh;overflow:hidden}
.header{background:linear-gradient(135deg,#151b2d,#1e2a4a);padding:16px;text-align:center;border-bottom:2px solid var(--accent)}
.screen{display:none;height:calc(100vh - 120px);overflow-y:auto;padding:12px}
.screen.active{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.input{width:100%;padding:14px;border-radius:12px;border:1px solid #2a3655;background:#0f1423;color:#fff;margin:8px 0}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;margin:6px 0}
.btn-primary{background:linear-gradient(90deg,#00ff88,#00d4ff);color:#000}
#map{height:50vh;border-radius:16px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:10px 0}
.nav-item{color:#8b95b0;font-size:11px;padding:6px 16px;text-align:center}
.nav-item.active{color:#00ff88}
</style>
</head>
<body>
<div class="header"><h1>📍 GPS LIMAM PRO v2</h1><div style="font-size:11px">تخزين في كل الحالات - مسارات - دردشة</div></div>
<div id="screen-map" class="screen active"><div class="card"><span id="dot">🔴</span> <span id="statusText">غير متصل</span> - <span id="pointsCount">0 نقطة</span><input id="email" class="input" value="admin@gpslimam.app"><input id="password" class="input" type="password" value="123456"><button class="btn btn-primary" onclick="toggleTracking()" id="trackBtn">▶️ بدء التتبع</button></div><div id="map"></div><div class="card" id="latlng">بانتظار GPS...</div></div>
<div id="screen-routes" class="screen"><div class="card"><h3>🛣️ المسارات</h3><div id="routesList">لا توجد مسارات</div></div></div>
<div id="screen-chat" class="screen"><div id="chatBox" class="card" style="height:50vh;overflow:auto"></div><div class="card" style="display:flex;gap:6px"><input id="chatInput" class="input" placeholder="اكتب..."><button class="btn btn-primary" style="width:70px" onclick="sendChat()">إرسال</button></div></div>
<div id="screen-settings" class="screen"><div class="card"><h3>⚙️ الإعدادات</h3><p id="deviceId"></p></div></div>
<div class="bottom-nav"><div class="nav-item active" onclick="showScreen('map',this)">🗺️ الخريطة</div><div class="nav-item" onclick="showScreen('routes',this)">🛣️ المسارات</div><div class="nav-item" onclick="showScreen('chat',this)">💬 الدردشة</div><div class="nav-item" onclick="showScreen('settings',this)">⚙️ الإعدادات</div></div>
<script>
let map=L.map('map').setView([18.07,-15.95],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let poly=L.polyline([],{color:'#00ff88',weight:4}).addTo(map),marker,route=[],db;
function showScreen(n,el){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+n).classList.add('active');document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));if(el)el.classList.add('active');setTimeout(()=>map.invalidateSize(),200)}
let open=indexedDB.open('GPS_LIMAM_PRO',1);open.onupgradeneeded=e=>{e.target.result.createObjectStore('locs',{autoIncrement:true})};open.onsuccess=e=>{db=e.target.result};
function toggleTracking(){if(!navigator.geolocation)return alert('فعل GPS');navigator.geolocation.watchPosition(p=>{let lat=p.coords.latitude,lng=p.coords.longitude;document.getElementById('latlng').innerText=lat.toFixed(5)+','+lng.toFixed(5);if(marker)marker.setLatLng([lat,lng]);else marker=L.marker([lat,lng]).addTo(map);poly.addLatLng([lat,lng]);map.setView([lat,lng],16);route.push([lat,lng]);if(db)db.transaction('locs','readwrite').objectStore('locs').add({lat,lng,t:Date.now()});document.getElementById('pointsCount').innerText=route.length+' نقطة';document.getElementById('dot').innerText='🟢';},e=>alert(e.message),{enableHighAccuracy:true})}
function sendChat(){let i=document.getElementById('chatInput'),b=document.getElementById('chatBox');if(!i.value)return;b.innerHTML+='<div style="background:#2a3655;padding:8px;border-radius:10px;margin:5px">'+i.value+'</div>';i.value='';b.scrollTop=b.scrollHeight}
document.getElementById('deviceId').innerText='ID: '+Math.random().toString(36).substring(2,8).toUpperCase()
</script></body></html>
