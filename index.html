<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS LIMAM v3</title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{background:#0f172a;color:#fff;font-family:sans-serif;margin:0;padding:10px;text-align:center}.card{background:#1e293b;padding:15px;border-radius:16px;margin:12px 0}input{width:90%;padding:12px;margin:6px;border-radius:10px;border:0;text-align:center;font-size:16px}.btn{width:94%;padding:14px;border:0;border-radius:12px;font-weight:bold;margin-top:8px;font-size:16px}.green{background:#22c55e;color:#000}.orange{background:#fb923c;color:#000}#log{font-size:13px;color:#fcd34d;min-height:22px;margin:6px}#mycode{color:#22f59e;font-size:22px}</style></head><body><h3 style="color:#22f59e">GPS LIMAM v3 PRO - FINAL</h3><div>كودك: <b id="mycode">...</b></div><div id="status">🔴 غير متصل</div><div id="log">جاهز</div><div class="card"><input id="email" value="moossaa88@gmail.com"><input id="pass" type="password" placeholder="كلمة المرور" value="123456"><button class="btn green" onclick="login()">دخول وبدء التتبع</button><div style="display:flex;gap:6px;justify-content:center;margin-top:10px"><button class="btn orange" style="width:70px" onclick="linkFriend()">ربط</button><input id="fcode" placeholder="كود صديقك" style="width:55%"></div></div><div id="map" style="width:100%;height:420px;background:#111;border-radius:14px"></div><script>const firebaseConfig={apiKey:"AIzaSyBO2jgQmcOv788nxFkWLwtebi34p7l14w8",authDomain:"gps-limam.firebaseapp.com",projectId:"gps-limam",storageBucket:"gps-limam.firebasestorage.app",messagingSenderId:"956637485694",appId:"1:956637485694:web:ed750daf9a3fd99eb6d62f"};let db,auth,myUid,map,myMarker,friendMarkers={};function init(){firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();map=L.map('map').setView([18,-15.9],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);auth.onAuthStateChanged(u=>{if(u){myUid=u.uid;document.getElementById('status').innerText="🟢 متصل - "+u.email;startTracking();}});}async function login(){const e=document.getElementById('email').value.trim().toLowerCase();const p=document.getElementById('pass').value.trim();log("جاري الدخول...");try{await auth.signInWithEmailAndPassword(e,p);log("تم الدخول ✅");}catch(err){try{await auth.createUserWithEmailAndPassword(e,p);log("تم إنشاء حساب ✅");}catch(e2){log("خطأ: "+e2.message);}} }const log=m=>{document.getElementById('log').innerText=m;};async function startTracking(){let myCode=Math.random().toString(36).substring(2,7).toUpperCase();document.getElementById('mycode').innerText=myCode;await db.collection("users").doc(myUid).set({code:myCode,email:auth.currentUser.email,lat:0,lng:0,updated:Date.now()},{merge:true});log("كودك: "+myCode+" - جاري التتبع...");navigator.geolocation.watchPosition(async pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude;await db.collection("users").doc(myUid).update({lat,lng,updated:Date.now()});if(!myMarker){myMarker=L.marker([lat,lng]).addTo(map).bindPopup("أنت");map.setView([lat,lng],15);}else myMarker.setLatLng([lat,lng]);},e=>{log("فعل GPS: "+e.message)},{enableHighAccuracy:true});listenFriends();}async function linkFriend(){const c=document.getElementById('fcode').value.trim().toUpperCase();if(!c){log("اكتب كود صديقك");return;}const q=await db.collection("users").where("code","==",c).get();if(q.empty){log("الكود غير موجود");return;}await db.collection("users").doc(myUid).collection("friends").doc(q.docs[0].id).set({code:c});log("تم الربط ✅");}function listenFriends(){db.collection("users").doc(myUid).collection("friends").onSnapshot(snap=>{snap.forEach(d=>{db.collection("users").doc(d.id).onSnapshot(doc=>{if(!doc.exists)return;const data=doc.data();if(!data.lat)return;if(!friendMarkers[d.id])friendMarkers[d.id]=L.marker([data.lat,data.lng]).addTo(map).bindPopup(data.code+" - "+data.email);else friendMarkers[d.id].setLatLng([data.lat,data.lng]);});});});}window.onload=init;</script></body></html>
