name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install -g @capacitor/cli
      - run: npm init -y && npm install @capacitor/core @capacitor/android && npx cap init "GPS LIMAM" com.gpslimam.app --web-dir=. && npx cap add android && cp google-services.json android/app/ && npx cap copy
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gps-limam-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk