name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          mkdir -p www
          cp index.html manifest.json www/
          npx cap init "GPS LIMAM PRO" com.gpslimam.app --web-dir=www
          npx cap add android
          cp google-services.json android/app/
          npx cap copy android

      - name: Fix Kotlin Duplicate
        run: |
          echo "Fixing duplicate kotlin..."
          FILE="android/app/build.gradle"
          # نحذف jdk7 و jdk8 القديمة
          sed -i "/dependencies {/a \ configurations.implementation {\n exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n }" "$FILE"
          cat "$FILE"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gps-limam-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
