name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix android
        run: |
          rm -rf android
          flutter create --project-name gps_limam --org com.gpslimam.app --platforms=android.
      - name: Upgrade Kotlin
        run: |
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
          sed -i "s/org.jetbrains.kotlin.android.*version.*\".*\"/org.jetbrains.kotlin.android version \"1.9.22\"/" android/settings.gradle
          sed -i "s/org.jetbrains.kotlin.android.*version.*'.*'/org.jetbrains.kotlin.android version '1.9.22'/" android/settings.gradle || true
          cat android/build.gradle
          cat android/settings.gradle
      - name: Build
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: gps-limam-apk
          path: build/app/outputs/flutter-apk/app-release.apk