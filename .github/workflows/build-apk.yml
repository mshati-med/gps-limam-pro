name: Build PRO APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: |
          rm -rf android
          flutter create --project-name gps_limam --org com.gpslimam.app --platforms=android.
      - run: |
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
          sed -i "s/org.jetbrains.kotlin.android.*version.*\".*\"/org.jetbrains.kotlin.android version \"1.9.22\"/" android/settings.gradle || true
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: gps-limam-PRO
          path: build/app/outputs/flutter-apk/app-release.apk