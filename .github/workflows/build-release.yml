name: Build PRO v3 Friends
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix package name from google-services.json
        run: |
          # استخراج اسم الحزمة الحقيقي من google-services.json
          if [ -f google-services.json ]; then
            PKG=$(python3 -c "import json; data=json.load(open('google-services.json')); print(data['client'][0]['client_info']['android_client_info']['package_name'])")
            echo "Found package name: $PKG"
            echo "PKG_NAME=$PKG" >> $GITHUB_ENV
          else
            echo "PKG_NAME=com.limam.gpspro" >> $GITHUB_ENV
          fi

      - name: Build APK
        run: |
          echo '{"name":"gps-limam","type":"module","dependencies":{"@capacitor/core":"5.7.0","@capacitor/cli":"5.7.0","@capacitor/android":"5.7.0"}}' > package.json
          npm install --silent
          mkdir -p www
          cp index.html www/index.html
          [ -f manifest.json ] && cp manifest.json www/ || true
          echo "{\"appId\":\"$PKG_NAME\",\"appName\":\"GPS LIMAM v3\",\"webDir\":\"www\"}" > capacitor.config.json
          echo "Using appId: $PKG_NAME"
          npx cap add android
          [ -f google-services.json ] && cp google-services.json android/app/ || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint

      - uses: actions/upload-artifact@v4
        with:
          name: GPS-LIMAM-v3-FRIENDS
          path: android/app/build/outputs/apk/debug/app-debug.apk