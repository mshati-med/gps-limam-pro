name: Build v3 FINAL FIX
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Build APK
        run: |
          npm init -y
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --silent
          mkdir -p www
          cp index.html www/index.html
          echo '{"appId":"com.gpslimam.app","appName":"GPS LIMAM v3","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cp google-services.json android/app/google-services.json
          # ترقية Gradle ليدعم Java 21
          sed -i 's/gradle-8.0.2/gradle-8.7/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-8.0/gradle-8.7/g' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint

      - uses: actions/upload-artifact@v4
        with:
          name: GPS-LIMAM-v3-APK-FIXED
          path: android/app/build/outputs/apk/debug/app-debug.apk
