name: Build PRO v3 Friends

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & Java
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Capacitor Project From index.html
        run: |
          echo '{"name":"gps-limam","version":"3.0.0","type":"module","dependencies":{"@capacitor/core":"5.7.0","@capacitor/android":"5.7.0","@capacitor/cli":"5.7.0"}}' > package.json
          npm install
          mkdir -p www
          cp index.html www/index.html || cp ./index.html ./www/index.html
          cp manifest.json www/ 2>/dev/null || true
          cp google-services.json www/ 2>/dev/null || true
          echo '{"appId":"com.limam.gpspro","appName":"GPS LIMAM PRO v3","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cp google-services.json android/app/ 2>/dev/null || true

      - name: Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-LIMAM-v3-FRIENDS
          path: android/app/build/outputs/apk/debug/app-debug.apk