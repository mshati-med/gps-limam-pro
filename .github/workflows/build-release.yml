name: Build PRO Signed

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Capacitor
        run: |
          npm install
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk GPS-LIMAM-PRO-v3-FRIENDS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-LIMAM-PRO-v3
          path: GPS-LIMAM-PRO-v3-FRIENDS.apk