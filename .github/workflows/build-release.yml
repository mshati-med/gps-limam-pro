name: Build PRO v3 Friends

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20 & Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find project and Build
        run: |
          echo "Listing files:"
          ls -R | head -n 100
          PROJECT_DIR=$(find . -name "package.json" -type f | head -n 1 | xargs dirname)
          echo "Found project at: $PROJECT_DIR"
          if [ -z "$PROJECT_DIR" ]; then
            echo "No package.json found! creating minimal one"
            echo '{"name":"gps-limam","dependencies":{"@capacitor/core":"latest","@capacitor/android":"latest"}}' > package.json
            PROJECT_DIR="."
          fi
          cd $PROJECT_DIR
          npm install
          npx cap sync android || npx cap add android || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find APK and Upload
        run: |
          find . -name "*.apk" -type f
          APK=$(find . -name "*.apk" -type f | head -n 1)
          echo "APK found at $APK"
          cp "$APK" $GITHUB_WORKSPACE/GPS-LIMAM-v3-FRIENDS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-LIMAM-v3-FRIENDS
          path: GPS-LIMAM-v3-FRIENDS.apk